<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axiom – Offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --accent: #3b82f6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0f17; --fg: #e2e8f0; --muted: #94a3b8; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 22rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: var(--accent);
      border: 0; border-radius: 0.5rem; padding: 0.6rem 1.4rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Axiom is offline</h1>
    <p id="message">The server cannot be reached right now. Check your connection or try again in a moment.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    if (navigator.language && navigator.language.toLowerCase().startsWith('de')) {
      document.documentElement.lang = 'de'
      document.title = 'Axiom – Offline'
      document.getElementById('title').textContent = 'Axiom ist offline'
      document.getElementById('message').textContent = 'Der Server ist gerade nicht erreichbar. Prüfe deine Verbindung oder versuche es gleich noch einmal.'
      document.getElementById('retry').textContent = 'Erneut versuchen'
    }
    document.getElementById('retry').addEventListener('click', function () { location.reload() })
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
